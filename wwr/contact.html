<!DOCTYPE html>
<html lang="en-Us">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Contact White Water Rafting Company in Kolob, California. Find our address, phone number, email, location, and contact form">
    <meta name="author" content="Gideon Duah ">
    <title>Contact US - Whitewater Rafting Company</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-raftingcompas.jpg" alt="Whitewater Rafting Logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h>White Water Rafting Company</h>
        <section class="company-info">
            <div class="contact-details">
                <p><strong>123 Main River Street</strong></p>
                <p>Kolob, California</p>
                <p><strong>+19999999999</strong></p>
                <p><strong>info@whitewater.com</strong></p>
            </div>
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3969.866141602186!2d-0.01653612602982667!3d5.732411831852631!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdf7f00721b1123%3A0xfb474e4aea6b102f!2sMichel%20Camp!5e0!3m2!1sen!2sgh!4v1786572516740!5m2!1sen!2sgh"
                    width="600" height="450" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </section>
        <section class="contact-form-selection">
            <form>
                <div class="form-row">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your Name" required>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Your Email" required>
                </div>
                <fieldset>
                    <legend>Purpose</legend>
                    <label>
                        <input type="radio" name="purpose" value="general-inquiry" checked>
                        General inquiry
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="reservation-question" checked>
                        Reservation Question
                    </label>
                    <label>
                        <input type="radio" name="purpose" value="website-suggestion" checked>
                        Website Suggestion
                    </label>
                </fieldset>
                <div class="form-row">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Type your message here" rows="6" required>
                    </textarea>
                </div>
                <label class="subscribe">
                    <input type="checkbox" name="newsletter" value="yes"> Please subscribe to the monthly newsletter
                </label>
                <button type="submit"> Get in Touch!</button>
            </form>
        </section>
        <section class="employee-section">
            <h2>We Are Here To Serve You</h2>
            <div class="employees">
                <figure>
                    <img src="images/employee1.jpg" alt="Employee Profile">
                    <figcaption>River Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/employee2.jpg" alt="Employee Profile">
                    <figcaption>Reservations Manager</figcaption>
                </figure>
                <figure>
                    <img src="images/employee3.jpg" alt="Employee Profile">
                    <figcaption>Custom Service Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Whitewater Rafting| Gideon Duah</p>
        <nav class=" socialmedia">
            <a href="https://facebook.com"><img src="images/facebook.svg" alt="Facebook Icon"></a>
            <a href="https://linkedin.com"><img src="images/linkedin.svg" alt="Linkedin Icon"></a>
            <a href="https://instagram.com"><img src="images/instagram.svg" alt="Instagram Icon"></a>
        </nav>
    </footer>
</body>

</html>
